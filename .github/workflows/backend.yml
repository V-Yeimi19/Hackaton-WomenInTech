name: Backend quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mica_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: mica_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mica_test -d mica_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mica_test:test_only@localhost:5432/mica_test
      MICA_TEST_DATABASE_URL: postgresql+psycopg://mica_test:test_only@localhost:5432/mica_test
      MESSAGING_MODE: fake
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check app tests migrations
      - run: python -m mypy app
      - run: python -m alembic upgrade head
      - run: python -m pytest --cov=app --cov-report=term-missing --junitxml=test-results.xml
      - run: python -m app.jobs.worker --once
      - run: python -m app.jobs.scheduler --once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
      - run: docker build -t mica-backend:ci ..
