name: Frontend quality
on:
  push:
    paths: ["frontend/**", "docs/contracts/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "docs/contracts/**", ".github/workflows/frontend.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # El contrato del backend y los tipos del frontend no deben divergir.
      - run: npm run api:types && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
