[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mica-backend"
version = "0.1.0"
description = "Backend P0 de Mica · Mi Negocio"
readme = { text = "Backend P0 de Mica · Mi Negocio.", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.14,<1.15",
  "cryptography>=44,<45",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2.3,<3.3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<0.1",
  "reportlab>=5.1,<5.2",
  "sqlalchemy>=2.0.36,<2.1",
  "twilio>=9.4,<10",
  "tzdata>=2024.2",
  "uvicorn[standard]>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.integrations" = ["assets/*.png"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requiere PostgreSQL de pruebas (MICA_TEST_DATABASE_URL)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI usa Depends() como valor por defecto (patrón oficial).
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
