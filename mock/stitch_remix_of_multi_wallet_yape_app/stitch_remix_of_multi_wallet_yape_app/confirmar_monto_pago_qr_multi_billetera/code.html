<script>
(() => {
  // Teclado de monto: dígitos, punto decimal (máx. 2 decimales) y borrar. También acepta el teclado físico.
  const amountEl = document.getElementById('amount-text');
  let cur = '0';
  const paint = () => { amountEl.textContent = cur; };
  function press(key) {
    if (key === 'backspace') { cur = cur.slice(0, -1) || '0'; }
    else if (key === '.') { if (!cur.includes('.')) cur += '.'; }
    else {
      const [int, dec] = cur.split('.');
      if (dec !== undefined) { if (dec.length < 2) cur += key; }
      else if (cur === '0') cur = key;
      else if (int.length < 4) cur += key;
    }
    paint();
  }
  document.querySelectorAll('.pad-key').forEach(b => b.addEventListener('click', () => press(b.getAttribute('data-key'))));
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === '.' || e.key === ',') press('.');
    else if (e.key === 'Backspace') press('backspace');
    else if (e.key === 'Enter') document.getElementById('pay-submit-btn').click();
  });
  paint();
})();
</script>
