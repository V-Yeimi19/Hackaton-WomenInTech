<script>
  (() => {
    let currentAmountStr = "25";
    let isFresh = true;

    const amountDisplay = document.getElementById("amount-text");
    const payBtn = document.getElementById("pay-submit-btn");
    const toggleMsgBtn = document.getElementById("btn-toggle-msg");
    const msgContainer = document.getElementById("msg-container");

    if (toggleMsgBtn && msgContainer) {
      toggleMsgBtn.addEventListener("click", () => {
        msgContainer.classList.toggle("hidden");
        msgContainer.classList.toggle("flex");
      });
    }

    function updateAmountUI() {
      if (!currentAmountStr || currentAmountStr === "") {
        amountDisplay.textContent = "0";
      } else {
        amountDisplay.textContent = currentAmountStr;
      }
    }

    document.querySelectorAll(".pad-key").forEach((keyBtn) => {
      keyBtn.addEventListener("click", () => {
        const key = keyBtn.getAttribute("data-key");
        if (!key) return;
        
        if (isFresh) {
          currentAmountStr = "";
          isFresh = false;
        }

        if (key === "backspace") {
          currentAmountStr = currentAmountStr.slice(0, -1);
          if (currentAmountStr === "") currentAmountStr = "0";
        } else {
          if (currentAmountStr === "0") {
            currentAmountStr = key;
          } else {
            if (currentAmountStr.length < 6) {
              currentAmountStr += key;
            }
          }
        }
        updateAmountUI();
      });
    });

    // Multi-Wallet Modal Logic
    const backdrop = document.getElementById("wallet-sheet-backdrop");
    const sheetPanel = document.getElementById("wallet-sheet-panel");
    const openSheetBtn = document.getElementById("open-wallet-sheet");
    const closeSheetBtn = document.getElementById("close-wallet-sheet");
    const confirmWalletBtn = document.getElementById("confirm-wallet-selection");

    function openModal() {
      if (!backdrop) return;
      backdrop.classList.remove("hidden");
      setTimeout(() => {
        backdrop.classList.remove("opacity-0");
        sheetPanel.classList.remove("translate-y-full");
      }, 10);
    }

    function closeModal() {
      if (!backdrop) return;
      backdrop.classList.add("opacity-0");
      sheetPanel.classList.add("translate-y-full");
      setTimeout(() => {
        backdrop.classList.add("hidden");
      }, 300);
    }

    if (openSheetBtn) openSheetBtn.addEventListener("click", openModal);
    if (closeSheetBtn) closeSheetBtn.addEventListener("click", closeModal);
    if (backdrop) {
      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) closeModal();
      });
    }

    const walletOptions = document.querySelectorAll(".wallet-option");
    let selectedOptionEl = document.querySelector('.wallet-option[data-wallet-id="negocio"]');
    walletOptions.forEach((option) => {
      option.addEventListener("click", () => {
        walletOptions.forEach((opt) => {
          opt.classList.remove("bg-surface-container-low", "ring-2", "ring-primary-container");
          opt.classList.add("bg-surface-container-lowest");
          const radio = opt.querySelector(".wallet-radio");
          if (radio) {
            radio.className = "wallet-radio w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center";
            radio.innerHTML = "";
          }
        });

        option.classList.remove("bg-surface-container-lowest");
        option.classList.add("bg-surface-container-low", "ring-2", "ring-primary-container");
        const radio = option.querySelector(".wallet-radio");
        if (radio) {
          radio.className = "wallet-radio w-6 h-6 rounded-full border-2 border-primary-container flex items-center justify-center";
          radio.innerHTML = '<span class="w-3 h-3 rounded-full bg-secondary-fixed"></span>';
        }
        selectedOptionEl = option;
      });
    });

    if (confirmWalletBtn) {
      confirmWalletBtn.addEventListener("click", () => {
        if (selectedOptionEl) {
          const name = selectedOptionEl.getAttribute("data-wallet-name");
          const bal = selectedOptionEl.getAttribute("data-balance");
          const nameEl = document.getElementById("active-wallet-name");
          const balEl = document.getElementById("active-wallet-balance");
          if (nameEl) nameEl.textContent = name;
          if (balEl) balEl.textContent = `S/ ${bal}`;
        }
        closeModal();
      });
    }

    if (payBtn) {
      payBtn.addEventListener("click", () => {
        payBtn.classList.add("scale-95");
        const original = payBtn.innerHTML;
        payBtn.innerHTML = '<span>¡Yapeado!</span>';
        setTimeout(() => {
          payBtn.classList.remove("scale-95");
          payBtn.innerHTML = original;
        }, 1200);
      });
    }
  })();
</script>
<script>
  (() => {
    // Current input string state
    let currentAmountStr = "15.00";
    let isFresh = true; // resets on first pad press if desired

    const amountDisplay = document.getElementById("amount-text");
    const payBtnText = document.getElementById("pay-btn-text");
    const payBtn = document.getElementById("pay-submit-btn");

    function updateAmountUI() {
      if (!currentAmountStr || currentAmountStr === "") {
        currentAmountStr = "0.00";
      }
      amountDisplay.textContent = currentAmountStr;
      payBtnText.textContent = `Yapear S/ ${currentAmountStr}`;
    }

    // Number Pad Interactions
    document.querySelectorAll(".pad-key").forEach((keyBtn) => {
      keyBtn.addEventListener("click", () => {
        const key = keyBtn.getAttribute("data-key");
        
        if (isFresh) {
          currentAmountStr = "";
          isFresh = false;
        }

        if (key === "backspace") {
          currentAmountStr = currentAmountStr.slice(0, -1);
          if (currentAmountStr === "") currentAmountStr = "0";
        } else if (key === ".") {
          if (!currentAmountStr.includes(".")) {
            currentAmountStr = (currentAmountStr === "" ? "0" : currentAmountStr) + ".";
          }
        } else {
          // Check decimals limit (max 2 digits after dot)
          if (currentAmountStr.includes(".")) {
            const parts = currentAmountStr.split(".");
            if (parts[1] && parts[1].length >= 2) return;
          }
          // Prevent leading extra zeros
          if (currentAmountStr === "0" && key !== ".") {
            currentAmountStr = key;
          } else {
            if (currentAmountStr.length < 8) {
              currentAmountStr += key;
            }
          }
        }
        updateAmountUI();
      });
    });

    // Quick suggestion pills
    document.querySelectorAll(".quick-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const val = chip.getAttribute("data-val");
        currentAmountStr = `${val}.00`;
        isFresh = false;
        updateAmountUI();
      });
    });

    // Business Expense Toggle
    const expenseToggleBtn = document.getElementById("expense-toggle-btn");
    const expenseToggleDot = document.getElementById("expense-toggle-dot");
    let isBusinessExpense = true;

    expenseToggleBtn.addEventListener("click", () => {
      isBusinessExpense = !isBusinessExpense;
      if (isBusinessExpense) {
        expenseToggleBtn.classList.remove("bg-surface-container-high");
        expenseToggleBtn.classList.add("bg-primary-container");
        expenseToggleDot.classList.remove("translate-x-0");
        expenseToggleDot.classList.add("translate-x-4");
      } else {
        expenseToggleBtn.classList.remove("bg-primary-container");
        expenseToggleBtn.classList.add("bg-surface-container-high");
        expenseToggleDot.classList.remove("translate-x-4");
        expenseToggleDot.classList.add("translate-x-0");
      }
    });

    // Multi-Wallet Bottom Sheet Logic
    const backdrop = document.getElementById("wallet-sheet-backdrop");
    const sheetPanel = document.getElementById("wallet-sheet-panel");
    const openSheetBtn = document.getElementById("open-wallet-sheet");
    const activeWalletDisplay = document.getElementById("active-wallet-display");
    const closeSheetBtn = document.getElementById("close-wallet-sheet");
    const confirmWalletBtn = document.getElementById("confirm-wallet-selection");

    let selectedOptionEl = document.querySelector('.wallet-option[data-wallet-id="negocio"]');

    function openModal() {
      backdrop.classList.remove("hidden");
      setTimeout(() => {
        backdrop.classList.remove("opacity-0");
        sheetPanel.classList.remove("translate-y-full");
      }, 10);
    }

    function closeModal() {
      backdrop.classList.add("opacity-0");
      sheetPanel.classList.add("translate-y-full");
      setTimeout(() => {
        backdrop.classList.add("hidden");
      }, 300);
    }

    openSheetBtn.addEventListener("click", openModal);
    activeWalletDisplay.addEventListener("click", openModal);
    closeSheetBtn.addEventListener("click", closeModal);
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeModal();
    });

    // Selecting a Wallet inside bottom sheet
    const walletOptions = document.querySelectorAll(".wallet-option");
    walletOptions.forEach((option) => {
      option.addEventListener("click", () => {
        walletOptions.forEach((opt) => {
          opt.classList.remove("bg-surface-container-low", "ring-2", "ring-primary-container");
          opt.classList.add("bg-surface-container-lowest");
          const radio = opt.querySelector(".wallet-radio");
          radio.className = "wallet-radio w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center";
          radio.innerHTML = "";
        });

        option.classList.remove("bg-surface-container-lowest");
        option.classList.add("bg-surface-container-low", "ring-2", "ring-primary-container");
        const radio = option.querySelector(".wallet-radio");
        radio.className = "wallet-radio w-6 h-6 rounded-full border-2 border-primary-container flex items-center justify-center";
        radio.innerHTML = '<span class="w-3 h-3 rounded-full bg-secondary-fixed"></span>';

        selectedOptionEl = option;
      });
    });

    // Confirm wallet and reflect on the primary card
    confirmWalletBtn.addEventListener("click", () => {
      if (selectedOptionEl) {
        const name = selectedOptionEl.getAttribute("data-wallet-name");
        const type = selectedOptionEl.getAttribute("data-wallet-type");
        const bal = selectedOptionEl.getAttribute("data-balance");
        const icon = selectedOptionEl.getAttribute("data-icon");
        const iconBg = selectedOptionEl.getAttribute("data-icon-bg");

        document.getElementById("active-wallet-name").textContent = name;
        document.getElementById("active-wallet-badge").textContent = type;
        document.getElementById("active-wallet-balance").textContent = `S/ ${bal}`;
        document.getElementById("active-wallet-icon").textContent = icon;
        
        const iconWrapper = document.getElementById("active-wallet-icon-bg");
        iconWrapper.className = `w-10 h-10 rounded-full ${iconBg} flex items-center justify-center text-on-primary`;

        // Update badge styling according to type
        const badge = document.getElementById("active-wallet-badge");
        if (type === "NEGOCIO") {
          badge.className = "bg-primary-fixed text-on-primary-fixed-variant px-1.5 py-0.2 rounded-full font-label-sm text-[10px]";
        } else if (type === "PERSONAL") {
          badge.className = "bg-secondary-fixed/40 text-on-secondary-fixed-variant px-1.5 py-0.2 rounded-full font-label-sm text-[10px]";
        } else {
          badge.className = "bg-tertiary-fixed text-on-tertiary-fixed-variant px-1.5 py-0.2 rounded-full font-label-sm text-[10px]";
        }
      }
      closeModal();
    });

    // Payment action feedback
    payBtn.addEventListener("click", () => {
      const amountVal = parseFloat(currentAmountStr) || 0;
      if (amountVal <= 0) {
        alert("Ingresa un monto válido para yapear");
        return;
      }
      payBtn.classList.add("scale-95");
      payBtnText.textContent = "Procesando pago seguro...";
      setTimeout(() => {
        payBtn.classList.remove("scale-95");
        payBtnText.textContent = `¡Yapeaste S/ ${currentAmountStr}!`;
      }, 700);
    });
  })();
</script></main>






</body></html>
