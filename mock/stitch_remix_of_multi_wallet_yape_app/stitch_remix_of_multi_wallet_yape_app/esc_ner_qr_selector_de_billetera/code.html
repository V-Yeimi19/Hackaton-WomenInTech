  (function initQrScannerExperience() {
    // 1. LASER ANIMATION LOOP
    const laser = document.getElementById('scannerLaser');
    let direction = 1;
    let position = 24;
    const minPos = 24;
    const maxPos = 230;

    function animateLaser() {
      if (laser) {
        position += 2 * direction;
        if (position >= maxPos) direction = -1;
        if (position <= minPos) direction = 1;
        laser.style.top = position + 'px';
      }
      requestAnimationFrame(animateLaser);
    }
    requestAnimationFrame(animateLaser);

    // 2. FLASHLIGHT TOGGLE INTERACTION
    const flashBtn = document.getElementById('flashToggle');
    const flashIcon = document.getElementById('flashIcon');
    const flashText = document.getElementById('flashText');
    let isFlashOn = false;

    if (flashBtn && flashIcon && flashText) {
      flashBtn.addEventListener('click', () => {
        isFlashOn = !isFlashOn;
        if (isFlashOn) {
          flashIcon.textContent = 'flash_on';
          flashIcon.classList.add('text-secondary-fixed');
          flashText.textContent = 'Encendida';
          flashBtn.classList.add('bg-primary-container');
        } else {
          flashIcon.textContent = 'flash_off';
          flashIcon.classList.remove('text-secondary-fixed');
          flashText.textContent = 'Linterna';
          flashBtn.classList.remove('bg-primary-container');
        }
      });
    }

    // 3. BUSINESS TOGGLE SWITCH
    const businessToggle = document.getElementById('businessToggle');
    const businessToggleThumb = document.getElementById('businessToggleThumb');
    let isBusiness = true;

    if (businessToggle && businessToggleThumb) {
      businessToggle.addEventListener('click', () => {
        isBusiness = !isBusiness;
        businessToggle.setAttribute('aria-checked', String(isBusiness));
        if (isBusiness) {
          businessToggle.classList.replace('bg-surface-variant', 'bg-secondary-fixed');
          businessToggleThumb.classList.replace('translate-x-0', 'translate-x-4');
          businessToggleThumb.classList.replace('bg-on-surface-variant', 'bg-on-secondary-fixed');
        } else {
          businessToggle.classList.replace('bg-secondary-fixed', 'bg-surface-variant');
          businessToggleThumb.classList.add('translate-x-0');
          businessToggleThumb.classList.remove('translate-x-4');
          businessToggleThumb.classList.replace('bg-on-secondary-fixed', 'bg-on-surface-variant');
        }
      });
    }

    // 4. WALLET BOTTOM SHEET MODAL LOGIC
    const openSheetBtn = document.getElementById('openWalletSheetBtn');
    const closeSheetBtn = document.getElementById('closeWalletSheetBtn');
    const backdrop = document.getElementById('walletModalBackdrop');
    const panel = document.getElementById('walletSheetPanel');
    const walletOptions = document.querySelectorAll('.wallet-option');

    // UI Pill Targets
    const activeName = document.getElementById('activeWalletName');
    const activeBalance = document.getElementById('activeWalletBalance');
    const activeBadge = document.getElementById('activeWalletBadge');
    const activeIcon = document.getElementById('activeWalletIcon');

    function openModal() {
      if (backdrop && panel) {
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100');
        panel.classList.remove('translate-y-full');
        panel.classList.add('translate-y-0');
      }
    }

    function closeModal() {
      if (backdrop && panel) {
        backdrop.classList.add('opacity-0', 'pointer-events-none');
        backdrop.classList.remove('opacity-100');
        panel.classList.add('translate-y-full');
        panel.classList.remove('translate-y-0');
      }
    }

    if (openSheetBtn) openSheetBtn.addEventListener('click', openModal);
    if (closeSheetBtn) closeSheetBtn.addEventListener('click', closeModal);
    if (backdrop) {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeModal();
      });
    }

    // Switch active wallet on tap
    walletOptions.forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.getAttribute('data-name');
        const balance = btn.getAttribute('data-balance');
        const badge = btn.getAttribute('data-type');
        const icon = btn.getAttribute('data-icon');

        // Update active top pill UI
        if (activeName) activeName.textContent = name;
        if (activeBalance) activeBalance.textContent = `(${balance})`;
        if (activeBadge) activeBadge.textContent = badge;
        if (activeIcon) activeIcon.textContent = icon;

        // Reset check indicators
        walletOptions.forEach(opt => {
          opt.classList.remove('bg-surface-container-low');
          opt.classList.add('bg-surface-container-lowest');
          const indicator = opt.querySelector('.wallet-check-indicator');
          if (indicator) {
            indicator.className = 'wallet-check-indicator w-6 h-6 rounded-full bg-surface-container text-transparent flex items-center justify-center shrink-0';
          }
        });

        // Set selected style
        btn.classList.remove('bg-surface-container-lowest');
        btn.classList.add('bg-surface-container-low');
        const activeIndicator = btn.querySelector('.wallet-check-indicator');
        if (activeIndicator) {
          activeIndicator.className = 'wallet-check-indicator w-6 h-6 rounded-full bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center shrink-0 shadow-sm';
        }

        // Close modal smoothly
        setTimeout(closeModal, 180);
      });
    });
  })();
</script></main>
</body></html>
