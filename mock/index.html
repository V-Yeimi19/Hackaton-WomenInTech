<style>

  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); font-family:"Plus Jakarta Sans",system-ui,sans-serif; color:var(--ink); }
  body { display:flex; align-items:center; justify-content:center; gap:32px; }
  #phone { position:relative; width:412px; height:min(880px, calc(100dvh - 32px)); border-radius:44px;
           background:#111; padding:10px; box-shadow:0 30px 80px rgba(89,0,106,.25); }
  #screen { width:100%; height:100%; border:0; border-radius:34px; background:#fff7ff; display:block; }
  #toast { position:absolute; left:50%; top:84px; transform:translate(-50%,-8px); background:#332f37; color:#fff;
           padding:10px 16px; border-radius:14px; font-size:13px; font-weight:700; max-width:85%; text-align:center;
           opacity:0; pointer-events:none; transition:all .25s; z-index:10; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  #side { width:260px; font-size:13px; line-height:1.5; }
  #side h1 { font-size:20px; margin:0 0 4px; color:var(--primary); }
  #side p { margin:0 0 12px; color:#4f434f; }
  #side nav { display:flex; flex-direction:column; gap:6px; margin:12px 0; }
  #side button { font:inherit; font-weight:700; text-align:left; padding:8px 12px; border-radius:12px; border:0;
                 background:#fff; color:var(--ink); cursor:pointer; }
  #side button:hover { background:var(--accent); }
  #side button.reset { background:transparent; color:var(--primary); text-decoration:underline; padding:4px 0; }
  #balances { background:#fff; border-radius:14px; padding:10px 12px; }
  #balances div { display:flex; justify-content:space-between; }
  @media (max-width: 760px) {
    body { display:block; }
    #side { display:none; }
    #phone { width:100%; height:100dvh; border-radius:0; padding:0; box-shadow:none; }
    #screen { border-radius:0; }
  }
</style>
</head>
<body>
<div id="phone">
  <iframe id="screen" title="Pantalla del prototipo"></iframe>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<aside id="side">

  <p>Mock unido de Stitch. Dinero ficticio; el estado vive en este navegador.</p>

  <button class="reset" id="reset">Reiniciar demo</button>
</aside>

l\">\n        <span class=\"font-label-sm text-label-sm text-secondary font-bold uppercase tracking-wider\">Yapear dinero<\/span>\n        <span class=\"font-headline-sm text-headline-sm text-on-surface\">Billetera de Origen<\/span>\n      <\/div>\n      <button onclick=\"window.closeWalletSend()\" class=\"w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant hover:text-primary-container flex items-center justify-center transition-colors\">\n        <span class=\"material-symbols-outlined text-[20px]\">close<\/span>\n      <\/button>\n    <\/div>\n\n    <!-- Selected Origin Wallet Pill Card -->\n    <div class=\"bg-surface-container-low p-space-sm rounded-lg flex items-center justify-between border border-surface-container-high\">\n      <div class=\"flex items-center gap-space-sm\">\n        <div class=\"w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-sm\">\n          <span class=\"material-symbols-outlined text-[20px] text-secondary-fixed\">account_balance_wallet<\/span>\n        <\/div>\n        <div class=\"flex flex-col\">\n          <span class=\"font-label-md text-label-md font-bold text-on-surface\" id=\"send-modal-wallet-name\">Principal<\/span>\n          <span class=\"font-label-sm text-label-sm text-on-surface-variant\" id=\"send-modal-wallet-balance\">Disponible: S/ 1,820.50<\/span>\n        <\/div>\n      <\/div>\n      <span class=\"material-symbols-outlined text-[20px] text-secondary\">check_circle<\/span>\n    <\/div>\n\n    <!-- Quick Target Contacts Input / Options -->\n    <div class=\"flex flex-col gap-2 mt-1\">\n      <label class=\"font-label-sm text-label-sm text-on-surface-variant\">¿A quién deseas yapear?<\/label>\n      <div class=\"flex items-center gap-2 bg-surface-container-high p-2 rounded-lg\">\n        <span class=\"material-symbols-outlined text-[20px] text-on-surface-variant\">search<\/span>\n        <input id=\"yape-dest-input\" type=\"text\" placeholder=\"Ingresa celular o busca contacto...\" class=\"bg-transparent w-full text-body-md text-on-surface outline-none placeholder:text-on-surface-variant/70\">\n      <\/div>\n      <div class=\"grid grid-cols-3 gap-2 mt-2\">\n        <button onclick=\"window.selectQuickContact('Mamá', '987654321')\" class=\"p-2 rounded-lg bg-surface-container-low hover:bg-surface-container-high flex flex-col items-center gap-1 transition-colors active:scale-95 text-center\">\n          <div class=\"w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-bold text-[12px]\">M<\/div>\n          <span class=\"font-label-sm text-label-sm text-on-surface truncate w-full\">Mamá<\/span>\n        <\/button>\n        <button onclick=\"window.selectQuickContact('Carlos Ruiz', '912345678')\" class=\"p-2 rounded-lg bg-surface-container-low hover:bg-surface-container-high flex flex-col items-center gap-1 transition-colors active:scale-95 text-center\">\n          <div class=\"w-8 h-8 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center font-bold text-[12px]\">CR<\/div>\n          <span class=\"font-label-sm text-label-sm text-on-surface truncate w-full\">Carlos Ruiz<\/span>\n        <\/button>\n        <button onclick=\"window.selectQuickContact('Proveedor Café', '998877665')\" class=\"p-2 rounded-lg bg-surface-container-low hover:bg-surface-container-high flex flex-col items-center gap-1 transition-colors active:scale-95 text-center\">\n          <div class=\"w-8 h-8 rounded-full bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center font-bold text-[12px]\">PC<\/div>\n          <span class=\"font-label-sm text-label-sm text-on-surface truncate w-full\">Proveedor<\/span>\n        <\/button>\n      <\/div>\n    <\/div>\n\n    <!-- Confirm / Continue Button -->\n    <div class=\"pt-2\">\n      <button onclick=\"window.confirmYapeAction()\" class=\"w-full py-3 px-4 rounded-full bg-secondary-container hover:brightness-95 active:scale-95 text-on-secondary-container font-headline-sm text-headline-sm font-bold transition-all flex items-center justify-center gap-2 shadow-md cursor-pointer\">\n        <span class=\"material-symbols-outlined text-[20px]\">send<\/span>\n        <span class=\"\">Continuar al Monto<\/span>\n      <\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- Notification Toast for interactive feedback -->\n<div id=\"wallet-toast\" class=\"fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full font-label-md text-label-md flex items-center gap-2 shadow-lg transition-all opacity-0 pointer-events-none transform -translate-y-2\">\n  <span class=\"material-symbols-outlined text-[18px] text-secondary-fixed\" id=\"toast-icon\">check_circle<\/span>\n  <span id=\"toast-message\" class=\"\">Acción completada<\/span>\n<\/div>\n\n<!-- Script with Handlers -->\n<script>\n  (function() {\n    const qrModal = document.getElementById('wallet-qr-modal');\n    const qrSheet = document.getElementById('wallet-qr-sheet');\n    const sendModal = document.getElementById('wallet-send-modal');\n    const sendSheet = document.getElementById('wallet-send-sheet');\n    const toast = document.getElementById('wallet-toast');\n    const toastMsg = document.getElementById('toast-message');\n    const toastIcon = document.getElementById('toast-icon');\n\n    function showToast(text, iconName = 'check_circle') {\n      if (!toast) return;\n      toastMsg.textContent = text;\n      if (toastIcon) toastIcon.textContent = iconName;\n      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');\n      toast.classList.add('opacity-100', 'translate-y-0');\n      setTimeout(() => {\n        toast.classList.remove('opacity-100', 'translate-y-0');\n        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');\n      }, 2500);\n    }\n\n    window.openWalletQR = function(name, balance, subtitle, icon) {\n      if (!qrModal || !qrSheet) return;\n      document.getElementById('qr-modal-title').textContent = name;\n      document.getElementById('qr-modal-subtitle').textContent = subtitle || 'Cobro directo a ' + name;\n      if (icon) {\n        document.getElementById('qr-modal-icon').textContent = icon;\n      }\n      qrModal.classList.remove('pointer-events-none', 'opacity-0');\n      qrModal.classList.add('opacity-100');\n      setTimeout(() => {\n        qrSheet.classList.remove('translate-y-full');\n        qrSheet.classList.add('translate-y-0');\n      }, 10);\n    };\n\n    window.closeWalletQR = function() {\n      if (!qrModal || !qrSheet) return;\n      qrSheet.classList.remove('translate-y-0');\n      qrSheet.classList.add('translate-y-full');\n      setTimeout(() => {\n        qrModal.classList.add('opacity-0', 'pointer-events-none');\n        qrModal.classList.remove('opacity-100');\n      }, 250);\n    };\n\n    window.openWalletSend = function(name, balance) {\n      if (!sendModal || !sendSheet) return;\n      document.getElementById('send-modal-wallet-name').textContent = name;\n      document.getElementById('send-modal-wallet-balance').textContent = 'Disponible: ' + balance;\n      sendModal.classList.remove('pointer-events-none', 'opacity-0');\n      sendModal.classList.add('opacity-100');\n      setTimeout(() => {\n        sendSheet.classList.remove('translate-y-full');\n        sendSheet.classList.add('translate-y-0');\n      }, 10);\n    };\n\n    window.closeWalletSend = function() {\n      if (!sendModal || !sendSheet) return;\n      sendSheet.classList.remove('translate-y-0');\n      sendSheet.classList.add('translate-y-full');\n      setTimeout(() => {\n        sendModal.classList.add('opacity-0', 'pointer-events-none');\n        sendModal.classList.remove('opacity-100');\n      }, 250);\n    };\n\n    window.simulateShareQR = function() {\n      showToast('Enlace de cobro QR copiado al portapapeles', 'share');\n      setTimeout(window.closeWalletQR, 900);\n    };\n\n    window.simulateDownloadQR = function() {\n      showToast('Código QR guardado en la galería', 'download_done');\n      setTimeout(window.closeWalletQR, 900);\n    };\n\n    window.selectQuickContact = function(contactName, phone) {\n      const input = document.getElementById('yape-dest-input');\n      if (input) input.value = contactName + ' (' + phone + ')';\n    };\n\n    window.confirmYapeAction = function() {\n      const origin = document.getElementById('send-modal-wallet-name').textContent;\n      const input = document.getElementById('yape-dest-input');\n      const target = (input && input.value) ? input.value : 'destinatario';\n      showToast('Iniciando envío desde ' + origin, 'send');\n      setTimeout(window.closeWalletSend, 900);\n    };\n\n    // Close on backdrop click\n    qrModal?.addEventListener('click', function(e) { if (e.target === qrModal) window.closeWalletQR(); });\n    sendModal?.addEventListener('click', function(e) { if (e.target === sendModal) window.closeWalletSend(); });\n  })();\n<\/script><\/div><\/main><!-- Acceso al agente Mica (asesora contable) -->\n<button type=\"button\" id=\"btn-agent\" aria-label=\"Hablar con Mica, tu asesora contable\" class=\"fixed right-4 bottom-[104px] z-50 w-16 h-16 rounded-full overflow-hidden bg-white ring-4 ring-surface shadow-[0_8px_24px_rgba(89,0,106,0.35)] hover:scale-105 active:scale-95 transition-transform\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCADAAMADASIAAhEBAxEB/8QAHQAAAAYDAQAAAAAAAAAAAAAAAAEFBgcIAwQJAv/EAEEQAAIBAwMDAgQDBQUGBgMAAAECAwQFEQAGIQcSMUFRCBMiYRRxgSMyQpGhFVJigrEWJDNyktE0U6KyweEXJZP/xAAcAQABBQEBAQAAAAAAAAAAAAAFAAIDBAYHAQj/xAA7EQABAwIEAwUGBQMDBQAAAAABAgMRAAQFEiExBkFREyJhcYEHFDKRobFCUsHR8BUj4WJy8QgWM4Ki/9oADAMBAAIRAxEAPwC/ei0fpocZ0qVD10NDQ8aVKi8DJO nts-none', '-translate-y-2');\n      }, 2500);\n    }\n\n    window.openWalletQR = function(name, balance, subtitle, icon) {\n      if (!qrModal || !qrSheet) return;\n      document.getElementById('qr-modal-title').textContent = name;\n      document.getElementById('qr-modal-subtitle').textContent = subtitle || 'Cobro directo a ' + name;\n      if (icon) {\n        document.getElementById('qr-modal-icon').textContent = icon;\n      }\n      qrModal.classList.remove('pointer-events-none', 'opacity-0');\n      qrModal.classList.add('opacity-100');\n      setTimeout(() => {\n        qrSheet.classList.remove('translate-y-full');\n        qrSheet.classList.add('translate-y-0');\n      }, 10);\n    };\n\n    window.closeWalletQR = function() {\n      if (!qrModal || !qrSheet) return;\n      qrSheet.classList.remove('translate-y-0');\n      qrSheet.classList.add('translate-y-full');\n      setTimeout(() => {\n        qrModal.classList.add('opacity-0', 'pointer-events-none');\n        qrModal.classList.remove('opacity-100');\n      }, 250);\n    };\n\n    window.openWalletSend = function(name, balance) {\n      if (!sendModal || !sendSheet) return;\n      document.getElementById('send-modal-wallet-name').textContent = name;\n      document.getElementById('send-modal-wallet-balance').textContent = 'Disponible: ' + balance;\n      sendModal.classList.remove('pointer-events-none', 'opacity-0');\n      sendModal.classList.add('opacity-100');\n      setTimeout(() => {\n        sendSheet.classList.remove('translate-y-full');\n        sendSheet.classList.add('translate-y-0');\n      }, 10);\n    };\n\n    window.closeWalletSend = function() {\n      if (!sendModal || !sendSheet) return;\n      sendSheet.classList.remove('translate-y-0');\n      sendSheet.classList.add('translate-y-full');\n      setTimeout(() => {\n        sendModal.classList.add('opacity-0', 'pointer-events-none');\n        sendModal.classList.remove('opacity-100');\n      }, 250);\n    };\n\n    window.simulateShareQR = function() {\n      showToast('Enlace de cobro QR copiado al portapapeles', 'share');\n      setTimeout(window.closeWalletQR, 900);\n    };\n\n    window.simulateDownloadQR = function() {\n      showToast('Código QR guardado en la galería', 'download_done');\n      setTimeout(window.closeWalletQR, 900);\n    };\n\n    window.selectQuickContact = function(contactName, phone) {\n      const input = document.getElementById('yape-dest-input');\n      if (input) input.value = contactName + ' (' + phone + ')';\n    };\n\n    window.confirmYapeAction = function() {\n      const origin = document.getElementById('send-modal-wallet-name').textContent;\n      const input = document.getElementById('yape-dest-input');\n      const target = (input && input.value) ? input.value : 'destinatario';\n      showToast('Iniciando envío desde ' + origin, 'send');\n      setTimeout(window.closeWalletSend, 900);\n    };\n\n    // Close on backdrop click\n    qrModal?.addEventListener('click', function(e) { if (e.target === qrModal) window.closeWalletQR(); });\n    sendModal?.addEventListener('click', function(e) { if (e.target === sendModal) window.closeWalletSend(); });\n  })();\n<\/script><\/div><\/main><!-- Acceso al agente Mica (asesora contable) -->\n<button type=\"button\" id=\"btn-agent\" aria-label=\"Hablar con Mica, tu asesora contable\" class=\"fixed right-4 bottom-[104px] z-50 w-16 h-16 rounded-full overflow-hidden bg-white ring-4 ring-surface shadow-[0_8px_24px_rgba(89,0,106,0.35)] hover:scale-105 active:scale-95 transition-transform\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCADAAMADASIAAhEBAxEB/8QAHQAAAAYDAQAAAAAAAAAAAAAAAAEFBgcIAwQJAv/EAEEQAAIBAwMDAgQDBQUGBgMAAAECAwQFEQAGIQcSMUFRCBMiYRRxgSMyQpGhFVJigrEWJDNyktE0U6KyweEXJZP/xAAcAQABBQEBAQAAAAAAAAAAAAAFAAIDBAYHAQj/ ap-2 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface text-label-sm font-label-sm\" onclick=\"fillNumber('987112445')\" type=\"button\">\n<span class=\"w-6 h-6 rounded-full bg-secondary text-on-secondary flex items-center justify-center text-[10px]\">CR<\/span>\n<span>Carlos R.<\/span>\n<\/button>\n<button class=\"flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface text-label-sm font-label-sm\" onclick=\"fillNumber('932009184')\" type=\"button\">\n<span class=\"w-6 h-6 rounded-full bg-tertiary text-on-tertiary flex items-center justify-center text-[10px]\">LP<\/span>\n<span>Luis Panadería<\/span>\n<\/button>\n<\/div>\n<\/div>\n<!-- Confirm Continue Button -->\n<button class=\"w-full h-12 rounded-full bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-transform\" onclick=\"confirmPhonePayment()\" type=\"button\">\n<span>Continuar a Pagar<\/span>\n<span class=\"material-symbols-outlined text-[18px]\">arrow_forward<\/span>\n<\/button>\n<\/div>\n<\/div>\n<!-- Simulated Toast Feedback Notification -->\n<div class=\"fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-primary text-surface shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300\" id=\"toastNotification\">\n<span class=\"material-symbols-outlined text-secondary-fixed text-[18px]\" id=\"toastIcon\">check_circle<\/span>\n<span class=\"font-label-md text-label-md\" id=\"toastMsg\">QR Detectado con éxito<\/span>\n<\/div>\n<\/div>\n<script>\n  let torchState = false;\n\n  function toggleTorch() {\n    torchState = !torchState;\n    const btn = document.getElementById('torchToggleBtn');\n    const icon = document.getElementById('torchIcon');\n    const feed = document.getElementById('cameraFeedSim');\n    \n    if (torchState) {\n      btn.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');\n      btn.classList.remove('bg-primary/70', 'text-surface');\n      icon.innerText = 'flash_on';\n      if (feed) feed.classList.add('brightness-[1.1]', 'contrast-[1.15]');\n      showToast('Linterna activada', 'flashlight_on');\n    } else {\n      btn.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed');\n      btn.classList.add('bg-primary/70', 'text-surface');\n      icon.innerText = 'flash_off';\n      if (feed) feed.classList.remove('brightness-[1.1]', 'contrast-[1.15]');\n      showToast('Linterna desactivada', 'flash_off');\n    }\n  }\n\n  function selectWallet(buttonElement, walletName, walletBalance) {\n    const pills = document.querySelectorAll('.wallet-pill');\n    \n    pills.forEach(pill => {\n      pill.className = 'wallet-pill flex-shrink-0 snap-start px-space-md py-3 rounded-lg bg-surface-container-high/20 hover:bg-surface-container-high/30 text-surface flex flex-col gap-1 items-start text-left min-w-[210px] active:scale-98 transition-all';\n      const checkContainer = pill.querySelector('.w-5.h-5');\n      if (checkContainer) {\n        checkContainer.className = 'w-5 h-5 rounded-full bg-transparent flex items-center justify-center';\n        checkContainer.innerHTML = '';\n      }\n      const balanceSpan = pill.querySelector('span:last-child');\n      if (balanceSpan) {\n        balanceSpan.className = 'font-headline-sm text-headline-sm text-surface-bright';\n      }\n    });\n\n    buttonElement.className = 'wallet-pill flex-shrink-0 snap-start px-space-md py-3 rounded-lg bg-secondary-fixed text-on-secondary-fixed flex flex-col gap-1 items-start text-left shadow-[0_4px_16px_rgba(86,250,235,0.35)] min-w-[210px] active:scale-98 transition-all';\n    \n    const checkContainer = buttonElement.querySelector('.w-5.h-5');\n    if (checkContainer) {\n      checkContainer.className = 'w-5 h-5 rounded-full bg-on-secondary-fixed text-secondary-fixed flex items-center justify-center';\n      checkContainer.innerHTML = '<span class=\"material-symbols-outlined text-[14px] font-black\">check<\/span>';\n    }\n\n    const balanceSpan = buttonElement.querySelector('span:last-child');\n    if (balanceSpan) {\n      balanceSpan.className = 'font-headline-sm text-headline-sm text-on-secondary-fixed';\n    }\n\n    const labelSpan = document.getElementById('activeWalletLabel');\n    if (labelSpan) {\n      labelSpan.innerText = walletName;\n    }\n\n    showToast(`Billetera: ${walletName}`, 'account_balance_wallet');\n  }\n\n  function simulateGalleryScan(input) {\n    if (input.files && input.files[0]) {\n      showToast('Analizando QR de foto...', 'image_search');\n      setTimeout(() => {\n        showToast('Código QR verificado: Panadería San Martín', 'task_alt');\n      }, 1000);\n    }\n  }\n\n  function openManualPhoneModal() {\n    const modal = document.getElementById('phoneModal');\n    modal.classList.remove('hidden');\n    modal.classList.add('flex');\n    const input = document.getElementById('phoneInput');\n    if (input) input.focus();\n  }\n\n  function closeManualPhoneModal() {\n    const modal = document.getElementById('phoneModal');\n    modal.classList.add('hidden');\n    modal.classList.remove('flex');\n  }\n\n  function fillNumber(num) {\n    const input = document.getElementById('phoneInput');\n    if (input) {\n      input.value = num;\n      input.focus();\n    }\n  }\n\n  function confirmPhonePayment() {\n    const input = document.getElementById('phoneInput');\n    if (input && input.value.length >= 9) {\n      closeManualPhoneModal();\n      showToast(`Destino: +51 ${input.value}`, 'send_money');\n    } else {\n      showToast('Ingresa un número válido de 9 dígitos', 'error');\n    }\n  }\n\n  function addNewWalletModal() {\n    showToast('Creando nueva billetera / cuenta...', 'add_circle');\n  }\n\n  function showToast(text, iconName = 'check_circle') {\n    const toast = document.getElementById('toastNotification');\n    const msg = document.getElementById('toastMsg');\n    const icon = document.getElementById('toastIcon');\n    if (!toast || !msg) return;\n\n    msg.innerText = text;\n    if (icon) icon.innerText = iconName;\n    \n    toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');\n    toast.classList.add('opacity-100', 'translate-y-0');\n\n    clearTimeout(window._toastTimeout);\n    window._toastTimeout = setTimeout(() => {\n      toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');\n      toast.classList.remove('opacity-100', 'translate-y-0');\n    }, 2400);\n  }\n<\/script><\/main>\n<\/body><\/html>", "escanear-foto": "<!DOCTYPE html><html lang=\"es\" data-lt-installed=\"true\"><head><meta charset=\"utf-8\"><meta content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\" name=\"viewport\"><meta content=\"mobile_tab\" name=\"shell-type\"><link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"><link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"><link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\"><link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200\" rel=\"stylesheet\">\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\">\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}<\/style><script src=\"https://cdn.tailwindcss.com\"><\/script><script i {\n          businessToggle.classList.replace('bg-surface-variant', 'bg-secondary-fixed');\n          businessToggleThumb.classList.replace('translate-x-0', 'translate-x-4');\n          businessToggleThumb.classList.replace('bg-on-surface-variant', 'bg-on-secondary-fixed');\n        } else {\n          businessToggle.classList.replace('bg-secondary-fixed', 'bg-surface-variant');\n          businessToggleThumb.classList.add('translate-x-0');\n          businessToggleThumb.classList.remove('translate-x-4');\n          businessToggleThumb.classList.replace('bg-on-secondary-fixed', 'bg-on-surface-variant');\n        }\n      });\n    }\n\n    // 4. WALLET BOTTOM SHEET MODAL LOGIC\n    const openSheetBtn = document.getElementById('openWalletSheetBtn');\n    const closeSheetBtn = document.getElementById('closeWalletSheetBtn');\n    const backdrop = document.getElementById('walletModalBackdrop');\n    const panel = document.getElementById('walletSheetPanel');\n    const walletOptions = document.querySelectorAll('.wallet-option');\n\n    // UI Pill Targets\n    const activeName = document.getElementById('activeWalletName');\n    const activeBalance = document.getElementById('activeWalletBalance');\n    const activeBadge = document.getElementById('activeWalletBadge');\n    const activeIcon = document.getElementById('activeWalletIcon');\n\n    function openModal() {\n      if (backdrop && panel) {\n        backdrop.classList.remove('opacity-0', 'pointer-events-none');\n        backdrop.classList.add('opacity-100');\n        panel.classList.remove('translate-y-full');\n        panel.classList.add('translate-y-0');\n      }\n    }\n\n    function closeModal() {\n      if (backdrop && panel) {\n        backdrop.classList.add('opacity-0', 'pointer-events-none');\n        backdrop.classList.remove('opacity-100');\n        panel.classList.add('translate-y-full');\n        panel.classList.remove('translate-y-0');\n      }\n    }\n\n    if (openSheetBtn) openSheetBtn.addEventListener('click', openModal);\n    if (closeSheetBtn) closeSheetBtn.addEventListener('click', closeModal);\n    if (backdrop) {\n      backdrop.addEventListener('click', (e) => {\n        if (e.target === backdrop) closeModal();\n      });\n    }\n\n    // Switch active wallet on tap\n    walletOptions.forEach(btn => {\n      btn.addEventListener('click', () => {\n        const name = btn.getAttribute('data-name');\n        const balance = btn.getAttribute('data-balance');\n        const badge = btn.getAttribute('data-type');\n        const icon = btn.getAttribute('data-icon');\n\n        // Update active top pill UI\n        if (activeName) activeName.textContent = name;\n        if (activeBalance) activeBalance.textContent = `(${balance})`;\n        if (activeBadge) activeBadge.textContent = badge;\n        if (activeIcon) activeIcon.textContent = icon;\n\n        // Reset check indicators\n        walletOptions.forEach(opt => {\n          opt.classList.remove('bg-surface-container-low');\n          opt.classList.add('bg-surface-container-lowest');\n          const indicator = opt.querySelector('.wallet-check-indicator');\n          if (indicator) {\n            indicator.className = 'wallet-check-indicator w-6 h-6 rounded-full bg-surface-container text-transparent flex items-center justify-center shrink-0';\n          }\n        });\n\n        // Set selected style\n        btn.classList.remove('bg-surface-container-lowest');\n        btn.classList.add('bg-surface-container-low');\n        const activeIndicator = btn.querySelector('.wallet-check-indicator');\n        if (activeIndicator) {\n          activeIndicator.className = 'wallet-check-indicator w-6 h-6 rounded-full bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center shrink-0 shadow-sm';\n        }\n\n        // Close modal smoothly\n        setTimeout(closeModal, 180);\n      });\n    });\n  })();\n<\/script><\/main>\n<\/body><\/html>", "confirmar": "<!DOCTYPE html><html lang=\"es\" data-lt  width=\"10\" x=\"74\" y=\"94\"><\/rect>\n<rect height=\"8\" rx=\"1\" width=\"12\" x=\"92\" y=\"96\"><\/rect>\n<rect height=\"12\" rx=\"1\" width=\"8\" x=\"56\" y=\"116\"><\/rect>\n<rect height=\"6\" rx=\"1\" width=\"14\" x=\"70\" y=\"122\"><\/rect>\n<rect height=\"16\" rx=\"2\" width=\"8\" x=\"90\" y=\"116\"><\/rect>\n<rect height=\"8\" rx=\"1\" width=\"12\" x=\"104\" y=\"128\"><\/rect>\n<rect height=\"10\" rx=\"2\" width=\"10\" x=\"124\" y=\"118\"><\/rect>\n<rect height=\"8\" rx=\"1\" width=\"8\" x=\"138\" y=\"132\"><\/rect>\n<rect height=\"8\" rx=\"1\" width=\"12\" x=\"118\" y=\"54\"><\/rect>\n<rect height=\"12\" rx=\"2\" width=\"12\" x=\"134\" y=\"68\"><\/rect>\n<rect height=\"12\" rx=\"1\" width=\"8\" x=\"118\" y=\"86\"><\/rect>\n<\/g>\n<\/svg>\n<!-- Centered Yape Brand Emblem -->\n<div class=\"absolute inset-0 flex items-center justify-center pointer-events-none\">\n<div class=\"w-12 h-12 rounded-full bg-surface-container-lowest p-1 shadow-md flex items-center justify-center\">\n<img alt=\"Yape Multi-Wallet Logo\" class=\"w-full h-full object-contain rounded-full\" src=\"https://lh3.googleusercontent.com/aida/ALJJyrBjb96vXHhbX0ITHZhS1JCCXTGOx5017en4B0QC4sfBdP7lEAhsCiEala75nOiwcIgoC8V0DiChxuJpeWQisx96qql3pRy4qOyinF3nuBGuEHjLDP1mUL1-mDJxwFSSALKEGhjV_PNMMA6Zevh3d1gJ_Ko2DM2ozNI5OtNRRN3GEq7Fw-gtAZcydIV0ndvIdlfrIvbf-uen-Pjat7Xcsv6U__H230D-LQgrPOPtZ2H_eQ\"/>\n<\/div>\n<\/div>\n<\/div>\n<!-- Live Dynamic Amount Flag (Hidden by default, shown if amount set) -->\n<div class=\"hidden absolute -bottom-3 px-3 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed font-headline-sm text-sm shadow-md flex items-center gap-1\" id=\"qr-amount-badge\">\n<span class=\"material-symbols-outlined text-[16px]\">payments<\/span>\n<span id=\"badge-amount-display\">S/ 0.00<\/span>\n<\/div>\n<\/div>\n<!-- Account Details Presentation -->\n<div class=\"flex flex-col items-center text-center mt-space-xs\">\n<span class=\"font-headline-sm text-headline-sm text-on-surface\" id=\"recipient-name\">Rodrigo Mendoza P.<\/span>\n<div class=\"flex items-center gap-1.5 mt-0.5\">\n<span class=\"font-body-md text-body-md text-on-surface-variant font-mono\" id=\"recipient-phone\">*** *** 892<\/span>\n<button class=\"p-1 rounded-full hover:bg-surface-variant text-primary-container active:scale-90 transition-transform\" onclick=\"copyToClipboard('984 521 892')\" type=\"button\">\n<span class=\"material-symbols-outlined text-[16px]\">content_copy<\/span>\n<\/button>\n<\/div>\n<\/div>\n<!-- Optional Quick Custom Amount Trigger -->\n<div class=\"w-full mt-space-md pt-space-sm bg-surface-container-low rounded-DEFAULT p-space-sm flex flex-col gap-2\">\n<div class=\"flex items-center justify-between\">\n<label class=\"font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1\" for=\"custom-amount-input\">\n<span class=\"material-symbols-outlined text-[16px] text-primary\">price_change<\/span>\n          Agregar monto a cobrar (Opcional)\n        <\/label>\n<button class=\"hidden font-label-sm text-label-sm text-primary hover:underline\" id=\"clear-amount-btn\" onclick=\"clearAmount()\">\n          Quitar monto\n        <\/button>\n<\/div>\n<div class=\"relative flex items-center\">\n<span class=\"absolute left-3 font-headline-sm text-headline-sm text-primary-container\">S/<\/span>\n<input class=\"w-full h-11 pl-10 pr-4 rounded-full bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm focus:outline-none focus:ring-2 focus:ring-primary-container transition-all\" id=\"custom-amount-input\" inputmode=\"decimal\" oninput=\"updateQrAmount(this.value)\" placeholder=\"0.00\" type=\"number\"/>\n<\/div>\n<\/div>\n<\/div>\n<!-- Quick Toggle Shortcut Card (Emprendimiento Coffee direct switch) -->\n<div class=\"w-full p-space-sm rounded-DEFAULT bg-secondary-container/30 flex items-center justify-between shadow-sm\" id=\"quick-switch-banner\">\n<div class=\"flex items-center gap-space-sm\">\n<div class=\"w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed\">\n<span class=\"material-symbols-outlined text-[20px]\" id=\"switch-banner-icon\">storefront<\/span>\n<\/div>\n<div class=\"flex flex-col\">\n<span class=\"font-label-md text-label-md text-on-surface\" id=\"switch-banner-title\">¿Cobrando en tu negocio?<\/span>\n<span class=\"font-body-sm text-body-sm text-on-surface-variant\" id=\"switch-banner-sub\">Cambiar al instante a Emprendimiento Café<\/span>\n<\/div>\n<\/div>\n<button class=\"px-3.5 py-1.5 rounded-full bg-primary-container text-on-primary font-label-sm text-label-sm hover:opacity-90 active:scale-95 transition-all shrink-0\" id=\"switch-banner-cta\" onclick=\"toggleCafeShortcut()\" type=\"button\">\n      Cambiar\n    <\/button>\n<\/div>\n<!-- Primary Action CTA Row -->\n<div class=\"grid grid-cols-3 gap-space-sm w-full\">\n<!-- Share Button -->\n<button class=\"flex flex-col items-center justify-center py-3 px-2 rounded-DEFAULT bg-surface-container hover:bg-surface-variant active:scale-95 transition-all text-primary-container shadow-sm\" onclick=\"triggerShareModal()\" type=\"button\">\n<div class=\"w-9 h-9 rounded-full bg-primary-fixed flex items-center justify-center mb-1\">\n<span class=\"material-symbols-outlined text-[20px]\">share<\/span>\n<\/div>\n<span class=\"font-label-sm text-label-sm text-center\">Compartir QR<\/span>\n<\/button>\n<!-- Download Image Button -->\n<button class=\"flex flex-col items-center justify-center py-3 px-2 rounded-DEFAULT bg-surface-container hover:bg-surface-variant active:scale-95 transition-all text-primary-container shadow-sm\" onclick=\"triggerDownloadToast()\" type=\"button\">\n<div class=\"w-9 h-9 rounded-full bg-primary-fixed flex items-center justify-center mb-1\">\n<span class=\"material-symbols-outlined text-[20px]\">download<\/span>\n<\/div>\n<span class=\"font-label-sm text-label-sm text-center\">Descargar<\/span>\n<\/button>\n<!-- Copy Alias/Number Button -->\n<button class=\"flex flex-col items-center justify-center py-3 px-2 rounded-DEFAULT bg-surface-container hover:bg-surface-variant active:scale-95 transition-all text-primary-container shadow-sm\" onclick=\"copyToClipboard('984 521 892')\" type=\"button\">\n<div class=\"w-9 h-9 rounded-full bg-primary-fixed flex items-center justify-center mb-1\">\n<span class=\"material-symbols-outlined text-[20px]\">pin_invoke<\/span>\n<\/div>\n<span class=\"font-label-sm text-label-sm text-center\">Copiar Datos<\/span>\n<\/button>\n<\/div>\n<!-- Educational Explanatory Notice Banner -->\n<div class=\"w-full p-space-md rounded-DEFAULT bg-surface-container-high flex items-start gap-space-sm\">\n<span class=\"material-symbols-outlined text-primary-container text-[24px] mt-0.5 shrink-0\">tips_and_updates<\/span>\n<div class=\"flex flex-col gap-1\">\n<span class=\"font-label-md text-label-md text-primary-container\">Totalmente independiente<\/span>\n<p class=\"font-body-sm text-body-sm text-on-surface-variant leading-relaxed\">\n        Cada billetera genera un QR único. Los yapeos se abonan al instante a la cuenta elegida sin mezclar tu dinero personal ni tus ventas comerciales.\n      <\/p>\n<\/div>\n<\/div>\n<!-- Toast Notification Bubble (Appears on Action) -->\n<div class=\"fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-inverse-surface text-inverse-on-surface font-label-md text-label-md shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 transform scale-90\" id=\"toast-notification\">\n<span class=\"material-symbols-outlined text-[18px] text-secondary-fixed\" id=\"toast-icon\">check_circle<\/span>\n<span id=\"toast-text\">Acción realizada exitosamente<\/span>\n<\/div>\n<\/div>\n<!-- Micro-Interaction Logic for Multi-Wallet Switching and Dynamic QR Generation -->\n<script>\n  const walletProfiles = {\n    principal: {\n      name: \"Rodrigo Mendoza P.\",\n      title: \"Billetera Principal\",\n      phone: \"*** *** 892\",\n      fullPhone: \"984 521 892\",\n      icon: \"account_balance\",\n      iconBoxBg: \"bg-primary-fixed\",\n      iconColor: \"text-primary-container\",\n      desc: \"Los yapeos que recibas con este QR ingresarán directamente a tu saldo oficial de uso personal.\",\n      bannerTarget: \"cafe\",\n      bannerText: \"Cambiar al instante a Emprendimiento Café\",\n      bannerTitle: \"¿Cobrando en tu negocio?\"\n    },\n    cafe: {\n      name: \"Café Tostado & Barista S.A.C.\",\n      title: \"Emprendimiento Café\",\n      phone: \"RUC 10729384910\",\n      fullPhone: \"RUC 10729384910 (Café)\",\n      icon: \"local_cafe\",\n      iconBoxBg: \"bg-secondary-fixed\",\n      iconColor: \"text-on-secondary-fixed\",\n      desc: \"Ingresos de ventas comerciales. Separado contablemente de tus finanzas cotidianas.\",\n      bannerTarget: \"principal\",\n      bannerText: \"Volver a cobrar en tu Billetera Personal\",\n      bannerTitle: \"¿Cobro entre amigos?\"\n    },\n    vacaciones: {\n      name: \"Meta Vacaciones Cusco 2025\",\n      title: \"Ahorro Vacaciones\",\n      phone: \"Bolsa Ahorro #4489\",\n      fullPhone: \"Bolsa Ahorro Vacaciones\",\n      icon: \"beach_access\",\n      iconBoxBg: \"bg-tertiary-fixed\",\n      iconColor: \"text-tertiary-container\",\n      desc: \"Cada sol recibido aquí se bloquea con candado para tu viaje. No disponible para gastos diarios.\",\n      bannerTarget: \"principal\",\n      bannerText: \"Volver a tu Billetera Personal\",\n      bannerTitle: \"¿Listo para gastos diarios?\"\n    }\n  };\n\n  let activeWallet = \"principal\";\n\n  function switchWallet(walletKey) {\n    if (!walletProfiles[walletKey]) return;\n    activeWallet = walletKey;\n    const data = walletProfiles[walletKey];\n\n    // Update Pills Styles\n    document.querySelectorAll('.wallet-tab').forEach(tab => {\n      const isSelected = tab.getAttribute('data-wallet') === walletKey;\n      if (isSelected) {\n        tab.className = \"wallet-tab flex items-center gap-space-xs px-3.5 py-2.5 rounded-full bg-primary-container text-on-primary shadow-md active:scale-95 transition-all shrink-0\";\n      } else {\n        tab.className = \"wallet-tab flex items-center gap-space-xs px-3.5 py-2.5 rounded-full bg-surface-container text-on-surface hover:bg-surface-variant active:scale-95 transition-all shrink-0\";\n      }\n    });\n\n    // Animate QR reload pulse\n    const qrSvg = document.getElementById('dynamic-qr-svg');\n    if (qrSvg) {\n      qrSvg.classList.add('opacity-40', 'scale-95');\n      setTimeout(() => {\n        qrSvg.classList.remove('opacity-40', 'scale-95');\n      }, 180);\n    }\n\n    // Update Central Content\n    document.getElementById('current-wallet-title').textContent = data.title;\n    document.getElementById('current-wallet-icon').textContent = data.icon;\n    document.getElementById('recipient-name').textContent = data.name;\n    document.getElementById('recipient-phone').textContent = data.phone;\n    document.getElementById('wallet-desc-text').textContent = data.desc;\n\n    // Update Bottom Shortcut Banner\n    document.getElementById('switch-banner-title').textContent = data.bannerTitle;\n    document.getElementById('switch-banner-sub').textContent = data.bannerText;\n\n    showToast(`QR actualizado: ${data.title}`, 'swap_horiz');\n  }\n\n  function toggleCafeShortcut() {\n    const nextWallet = activeWallet === 'cafe' ? 'principal' : 'cafe';\n    switchWallet(nextWallet);\n  }\n\n  function updateQrAmount(val) {\n    const badge = document.getElementById('qr-amount-badge');\n    const badgeText = document.getElementById('badge-amount-display');\n    const clearBtn = document.getElementById('clear-amount-btn');\n    const num = parseFloat(val);\n\n    if (!isNaN(num) && num > 0) {\n      badgeText.textContent = `S/ ${num.toFixed(2)}`;\n      badge.classList.remove('hidden');\n      clearBtn.classList.remove('hidden');\n    } else {\n      badge.classList.add('hidden');\n      clearBtn.classList.add('hidden');\n    }\n  }\n\n  function clearAmount() {\n    const input = document.getElementById('custom-amount-input');\n    input.value = '';\n    updateQrAmount('');\n    showToast('Monto eliminado del QR', 'refresh');\n  }\n\n  function copyToClipboard(text) {\n    const current = walletProfiles[activeWallet];\n    navigator.clipboard?.writeText(current.fullPhone);\n    showToast(`Copiado: ${current.fullPhone}`, 'content_copy');\n  }\n\n  function triggerShareModal() {\n    const current = walletProfiles[activeWallet];\n    if (navigator.share) {\n      navigator.share({\n        title: `Mi QR Yape - ${current.title}`,\n        text: `Yapéame a ${current.name} (${current.phone})`,\n        url: window.location.href,\n      }).catch(() => {});\n    } else {\n      showToast('Enlace para compartir copiado', 'send');\n    }\n  }\n\n  function triggerDownloadToast() {\n    showToast('Guardando código QR en tu galería...', 'download_done');\n  }\n\n  function showToast(message, iconName = 'check_circle') {\n    const toast = document.getElementById('toast-notification');\n    const toastText = document.getElementById('toast-text');\n    const toastIcon = document.getElementById('toast-icon');\n\n    if (!toast) return;\n\n    toastText.textContent = message;\n    toastIcon.textContent = iconName;\n\n    toast.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');\n    toast.classList.add('opacity-100', 'scale-100');\n\n    clearTimeout(window._toastTimeout);\n    window._toastTimeout = setTimeout(() => {\n      toast.classList.add('opacity-0', 'pointer-events-none', 'scale-90');\n      toast.classList.remove('opacity-100', 'scale-100');\n    }, 2400);\n  }\n<\/script><\/main><nav class=\"fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-4px_24px_rgba(116,34,132,0.08)]\"><div class=\"px-space-md py-3 flex gap-space-sm\"><button type=\"button\" id=\"bar-scan\" class=\"flex-1 h-12 rounded-[12px] border-2 border-secondary text-secondary bg-surface-container-lowe {\n      const toggle = e.target.closest('.wallet-toggle');\n      if (toggle) {\n        const isChecked = toggle.getAttribute('aria-checked') === 'true';\n        const newChecked = !isChecked;\n        toggle.setAttribute('aria-checked', newChecked.toString());\n\n        const dot = toggle.querySelector('.toggle-dot');\n        const icon = toggle.querySelector('.toggle-icon');\n        const label = toggle.parentElement.querySelector('.toggle-label');\n\n        if (newChecked) {\n          toggle.classList.remove('bg-surface-container-highest', 'justify-start');\n          toggle.classList.add('bg-secondary-fixed', 'justify-end');\n          icon.textContent = 'check';\n          icon.className = 'material-symbols-outlined text-[13px] text-secondary toggle-icon';\n          label.textContent = 'Activa para pagar';\n          label.className = 'font-label-sm text-label-sm toggle-label text-secondary font-bold mt-1';\n          showToast('Billetera activada para pagos');\n        } else {\n          toggle.classList.remove('bg-secondary-fixed', 'justify-end');\n          toggle.classList.add('bg-surface-container-highest', 'justify-start');\n          icon.textContent = 'remove';\n          icon.className = 'material-symbols-outlined text-[13px] text-outline toggle-icon';\n          label.textContent = 'No visible al pagar';\n          label.className = 'font-label-sm text-label-sm toggle-label text-on-surface-variant font-medium mt-1';\n          showToast('Billetera excluida de pagos inmediatos');\n        }\n      }\n    });\n\n    // Reorder Handlers (Up / Down buttons)\n    container.addEventListener('click', (e) => {\n      const upBtn = e.target.closest('.btn-move-up');\n      const downBtn = e.target.closest('.btn-move-down');\n\n      if (upBtn) {\n        const currentItem = upBtn.closest('.wallet-item');\n        const prevItem = currentItem.previousElementSibling;\n        // Don't swap before the fixed base wallet\n        if (prevItem && prevItem.getAttribute('data-fixed') !== 'true') {\n          container.insertBefore(currentItem, prevItem);\n          currentItem.classList.add('bg-surface-container-low');\n          setTimeout(() => currentItem.classList.remove('bg-surface-container-low'), 300);\n        } else {\n          showToast('La Cuenta Base siempre permanece primera', 'info');\n        }\n      }\n\n      if (downBtn) {\n        const currentItem = downBtn.closest('.wallet-item');\n        const nextItem = currentItem.nextElementSibling;\n        if (nextItem) {\n          container.insertBefore(nextItem, currentItem);\n          currentItem.classList.add('bg-surface-container-low');\n          setTimeout(() => currentItem.classList.remove('bg-surface-container-low'), 300);\n        }\n      }\n    });\n\n    // Open Rename Modal\n    container.addEventListener('click', (e) => {\n      const editBtn = e.target.closest('.btn-edit-wallet');\n      if (editBtn) {\n        currentTargetCard = editBtn.closest('.wallet-item');\n        const nameSpan = currentTargetCard.querySelector('.wallet-name-text');\n        inputWalletName.value = nameSpan.textContent.trim();\n        charCounter.textContent = `${inputWalletName.value.length}/24`;\n        modalEdit.classList.remove('hidden');\n        inputWalletName.focus();\n      }\n    });\n\n    inputWalletName.addEventListener('input', () => {\n      charCounter.textContent = `${inputWalletName.value.length}/24`;\n    });\n\n    function closeModal() {\n      modalEdit.classList.add('hidden');\n      currentTargetCard = null;\n    }\n\n    btnCloseModal.addEventListener('click', closeModal);\n    btnCancelRename.addEventListener('click', closeModal);\n\n    btnConfirmRename.addEventListener('click', () => {\n      const trimmed = inputWalletName.value.trim();\n      if (trimmed && currentTargetCard) {\n        const nameSpan = currentTargetCard.querySelector('.wallet-name-text');\n        nameSpan.textContent = trimmed;\n        currentTargetCard.setAttribute('data-name', trimmed);\n        showToast('Nombre actualizado correctamente');\n        closeModal();\n      }\n    });\n\n    // Save changes CTA & Header 'Listo'\n    function triggerSaveFeedback() {\n      saveBtn.disabled = true;\n      const originalContent = saveBtn.innerHTML;\n      saveBtn.innerHTML = `\n        <span class=\"material-symbols-outlined animate-spin text-[22px]\">progress_activity<\/span>\n        <span>Guardando...<\/span>\n      `;\n\n      setTimeout(() => {\n        saveBtn.disabled = false;\n        saveBtn.innerHTML = originalContent;\n        showToast('¡Configuración de billeteras guardada!', 'task_alt');\n      }, 700);\n    }\n\n    saveBtn.addEventListener('click', triggerSaveFeedback);\n    topDoneBtn.addEventListener('click', triggerSaveFeedback);\n\n    // Create wallet button placeholder\n    createBtn.addEventListener('click', () => {\n      showToast('Abriendo creador de billeteras...', 'add_card');\n    });\n\n    // Simple Drag & Drop Simulation on Mobile / Desktop\n    let draggedElement = null;\n    const items = container.querySelectorAll('.wallet-item');\n\n    items.forEach((item) => {\n      if (item.getAttribute('data-fixed') === 'true') return;\n\n      item.setAttribute('draggable', 'true');\n\n      item.addEventListener('dragstart', (e) => {\n        draggedElement = item;\n        item.classList.add('opacity-50');\n        e.dataTransfer.effectAllowed = 'move';\n      });\n\n      item.addEventListener('dragend', () => {\n        draggedElement = null;\n        item.classList.remove('opacity-50');\n        items.forEach(i => i.classList.remove('ring-2', 'ring-secondary-fixed'));\n      });\n\n      item.addEventListener('dragover', (e) => {\n        e.preventDefault();\n        e.dataTransfer.dropEffect = 'move';\n      });\n\n      item.addEventListener('drop', (e) => {\n        e.preventDefault();\n        if (draggedElement && draggedElement !== item && item.getAttribute('data-fixed') !== 'true') {\n          const allItems = Array.from(container.querySelectorAll('.wallet-item'));\n          const draggedIndex = allItems.indexOf(draggedElement);\n          const targetIndex = allItems.indexOf(item);\n\n          if (draggedIndex < targetIndex) {\n            container.insertBefore(draggedElement, item.nextSibling);\n          } else {\n            container.insertBefore(draggedElement, item);\n          }\n          showToast('Orden de billeteras reorganizado', 'reorder');\n        }\n      });\n    });\n\n  })();\n<\/script><\/main>\n<\/body><\/html>", "billetera": "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"utf-8\"><meta content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\" name=\"viewport\"><meta content=\"mobile_tab\" name=\"shell-type\"><link href=\"https://fonts.googleapis.com\" rel=\"preconnect\"><link crossorigin=\"\" href=\"https://fonts.gstatic.com\" rel=\"preconnect\"><link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\"><link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200\" rel=\"stylesheet\">\n<link href=\"https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap\" rel=\"stylesheet\"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}<\/style><script src=\"https://cdn.tailwindcss.com\"><\/script><script id=\"tailwind-config\">tailwind.config = { darkMode: \"class\", theme: { extend: { colors: { \"on-error\": \"#ffffff\", \"on-primary-fixed\": \"#350040\", \"tertiary\": \"#680036\", \"surface-variant\": \"#e8e0eb\", \"erro ing-wider text-on-surface-variant mb-2\">Mover el saldo a<\/p>\n      <button type=\"button\" id=\"del-dest\" aria-haspopup=\"dialog\" class=\"dest-field w-full flex items-center gap-3 rounded-[12px] border-2 border-outline-variant hover:border-primary-container/60 bg-surface px-3 py-2.5 text-left transition\">\n      <span class=\"dest-icon w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center shrink-0\"><span class=\"material-symbols-outlined text-[20px]\">account_balance_wallet<\/span><\/span>\n      <span class=\"flex-1 min-w-0\"><span class=\"dest-name block font-label-lg text-[15px] text-on-surface-variant truncate\">Elige una billetera<\/span><span class=\"dest-bal block font-body-sm text-body-sm text-on-surface-variant\"><\/span><\/span>\n      <span class=\"material-symbols-outlined text-[22px] text-primary-container\">expand_more<\/span>\n    <\/button>\n    <\/div>\n    <div class=\"mt-space-md flex items-start gap-2 rounded-[12px] bg-error-container/50 p-3\">\n      <span class=\"material-symbols-outlined text-error text-[20px]\">warning<\/span>\n      <p id=\"del-warning\" class=\"font-body-sm text-body-sm text-on-error-container\"><\/p>\n    <\/div>\n    <p id=\"del-error\" class=\"hidden mt-2 font-body-sm text-body-sm text-error\" role=\"alert\"><\/p>\n    <div class=\"flex gap-space-sm mt-space-md\">\n      <button type=\"button\" id=\"btn-del-cancel\" class=\"flex-1 h-12 rounded-[12px] border-2 border-outline-variant text-on-surface-variant font-label-lg text-label-lg\">Cancelar<\/button>\n      <button type=\"button\" id=\"btn-del-confirm\" class=\"flex-1 h-12 rounded-[12px] bg-error text-on-error font-label-lg text-label-lg\"><\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- Hoja: elegir billetera de destino -->\n<div id=\"dest-sheet\" class=\"hidden fixed inset-0 z-[60] bg-inverse-surface/50 items-end justify-center\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dest-title\">\n  <div  + M.fmt(n); }\n  // Muestra la billetera elegida dentro del campo desplegable.\n  function paintField(btn, k) {\n    var w = k && M.wallet(k);\n    var icon = btn.querySelector('.dest-icon'), name = btn.querySelector('.dest-name'), bal = btn.querySelector('.dest-bal');\n    icon.firstElementChild.textContent = w ? M.ICON[k] : 'account_balance_wallet';\n    icon.className = 'dest-icon w-10 h-10 rounded-full flex items-center justify-center shrink-0 ' +\n      (w ? 'bg-primary-fixed text-primary-container' : 'bg-surface-container-high text-on-surface-variant');\n    name.textContent = w ? w.name : 'Elige una billetera';\n    name.classList.toggle('text-on-surface', !!w); name.classList.toggle('text-on-surface-variant', !w);\n    bal.textContent = w ? 'Saldo: ' + money(w.balance) : '';\n    btn.classList.toggle('border-primary-container', !!w); btn.classList.toggle('border-outline-variant', !w);\n  }\n\n  // Hoja inferior con todas las billeteras de destino. Con más de 5 aparece el buscador.\n  var SEARCH_FROM = 6, sheetPick = null, sheetSel = null;\n  function others() { return M.activeKeys().filter(function (k) { return k !== key; }); }\n  function renderSheet() {\n    var q = $('dest-search').value.trim().toLowerCase(), list = $('dest-list'), shown = 0;\n    list.innerHTML = '';\n    others().forEach(function (k) {\n      var w = M.wallet(k);\n      if (q && w.name.toLowerCase().indexOf(q) < 0) return;\n      shown++;\n      var on = k === sheetSel;\n      var b = document.createElement('button');\n      b.type = 'button'; b.dataset.key = k;\n      b.className = 'w-full flex items-center gap-3 p-3 rounded-[16px] text-left transition ' + (on ? 'bg-primary-fixed/50' : 'hover:bg-surface-container-low');\n      b.innerHTML = '<span class=\"w-11 h-11 rounded-full bg-primary-fixed text-primary-container flex items-center justify-center shrink-0\"><span class=\"material-symbols-outlined text-[22px]\"><\/span><\/span>' +\n        '<span class=\"flex-1 min-w-0\"><span class=\"block font-label-lg text-[15px] text-on-surface truncate\"><\/span><span class=\"block font-body-sm text-body-sm text-on-surface-variant\"><\/span><\/span>' +\n        '<span class=\"material-symbols-outlined text-[22px] ' + (on ? 'text-primary-container' : 'text-transparent') + '\">check_circle<\/span>';\n      var spans = b.querySelectorAll('span');\n      spans[1].textContent = M.ICON[k]; spans[3].textContent = w.name; spans[4].textContent = 'Saldo: ' + money(w.balance);\n      list.appendChild(b);\n    });\n    show($('dest-empty'), shown === 0);\n  }\n  function openSheet(selected, subtitle, onPick) {\n    sheetSel = selected; sheetPick = onPick;\n    $('dest-sub').textContent = subtitle;\n    $('dest-search').value = '';\n    show($('dest-search-wrap'), others().length >= SEARCH_FROM);\n    renderSheet();\n    show($('dest-sheet'), true);\n  }\n  function closeSheet() { show($('dest-sheet'), false); }\n  $('dest-search').addEventListener('input', renderSheet);\n  $('dest-close').addEventListener('click', closeSheet);\n  $('dest-sheet').addEventListener('click', function (e) { if (e.target.id === 'dest-sheet') closeSheet(); });\n  $('dest-list').addEventListener('click', function (e) {\n    var b = e.target.closest('button'); if (!b) return;\n    closeSheet(); sheetPick(b.dataset.key);\n  });\n\n  function render() {\n    var w = M.wallet(key);\n    if (!w) { M.go('home'); return; }\n    var locked = key === 'principal';\n    show($('w-locked'), locked);\n    $('w-icon').textContent = M.ICON[key];\n    $('w-name').textContent = w.name;\n    $('w-tag').textContent = M.TAG[key];\n    $('w-balance').textContent = M.fmt(w.balance);\n    show($('danger'), !locked);\n\n\n    // Movimientos\n    var txs = M.txsFor(key);\n    $('tx-count').textContent = txs.length ? String(txs.length) : '';\n    var list = $('tx-list'); list.innerHTML = '';\n    if (!txs.length) {\n      var p = document.createElement('p');\n      p.className = 'px-space-md py-6 border-t border-surf /* ---------- Estado compartido ---------- */

  { title: "Pago de Carlos Ruiz", when: "Hoy - 3:42 pm", amount: 45, keys: ["cafe"] },

];

let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem("mica-proto"));
    if (s && s.wallets) {
      if (!s.v) {  // estado guardado por versiones anteriores del prototipo
        s.txs = (s.txs || []).map(t => ({ title: t.title, amount: t.amount, keys: [t.key], when: "Hoy" })).concat(structuredClone(SEED_TXS));
        s.v = 2;
      }
      return s;
    }

  return structuredClone(DEFAULT_STATE);
}
function save() { try { localStorage.setItem("mica-proto", JSON.stringify(state)); } catch (e) {} renderSide(); }

const fmt = n => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtShort = n => Number.isInteger(n) ? String(n) : n.toFixed(2);
const total = () => Object.values(state.wallets).reduce((a, w) => a + w.balance, 0) + (state.extra ? state.extra.balance : 0);
function walletKey(name = "") {
  name = name.toLowerCase();
  for (const k of activeKeys()) if (name.includes(wallet(k).name.toLowerCase()) && k !== "principal") return k;
  if (name.includes("princ") || name.includes("personal")) return "principal";
  if (name.includes("caf")) return "cafe";

  if (state.extra && name.includes(state.extra.name.toLowerCase())) return "extra";

}
const wallet = k => k === "extra" ? state.extra : state.wallets[k];
const activeKeys = () => ["principal", "cafe", "vacaciones"].filter(k => state.wallets[k]).concat(state.extra ? ["extra"] : []);

  .replace(/\s*([ap])\.?\s*m\.?\s*$/i, (_, x) => " " + x.toLowerCase() + "m");
const txSub = t => `${t.when} - ${t.label || (wallet(t.keys[0]) || {}).name || ""}`;
const txsFor = k => state.txs.filter(t => t.keys.includes(k));
const round2 = n => Math.round(n * 100) / 100;
const isBusiness = k => k === "cafe" || (k === "extra" && !!state.extra && state.extra.purpose !== "savings");

function valueFor(target) {
  const raw = target.startsWith("raw:");
  const key = raw ? target.slice(4) : target;
  const n = key === "total" ? total() : (wallet(key) ? wallet(key).balance : 0);
  if (!raw) return fmt(n);
  return key === "total" ? n.toFixed(2) : "balance: " + n.toFixed(2);
}

function prepare(name) {
  let html = SCREENS[name];
  const table = Object.assign({}, BAL[name] || {});
  const extraText = {};
  for (const k of ["cafe", "vacaciones"]) {
    if (state.wallets[k] && state.wallets[k].name !== DEFAULT_NAMES[k]) extraText[DEFAULT_NAMES[k]] = state.wallets[k].name;
  }
  if (name === "home-nueva" && state.extra) {
    extraText["Mi Tienda Online"] = state.extra.name;
    extraText["S/ 0.00"] = "S/ " + fmt(state.extra.balance);
  }
  if (name === "yapear" && state.draft.recipient) extraText["Lucía Gómez R."] = state.draft.recipient;
  if (name === "confirmar") {
    if (!wallet(state.payWallet)) state.payWallet = "principal";
    const w = wallet(state.payWallet);
    extraText["Emprendimiento Café"] = w.name;
    table["1,450.00"] = state.payWallet;
    if (state.draft.qrRecipient) extraText["La Tiendita de Don Pepe"] = state.draft.qrRecipient;
  }
  if (name.startsWith("constancia") || name === "te-yapearon") {
    const now = new Date();
    const date = now.toLocaleDateString("es-PE", { day: "2-digit", month: "short", year: "numeric" }).replace(/ de /g, " ");
    const time = now.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hour12: true });
    for (const d of ["19 dic. 2025", "18 may. 2025"]) extraText[d] = date;
    for (const t of ["12:50 p. m.", "01:15 p. m.", "04:35 p. m."]) extraText[t] = time;
    const op = String(26100000 + Math.floor(Math.random() * 99999));
    extraText["26101992"] = op; extraText["26102048"] = op;
    if (name === "constancia-negocio" && state.last) extraText["Emprendimiento Café"] = state.last.walletName;
  }
  const replacements = {};
  for (const [k, v] of Object.entries(table)) if (v === "total" || v.startsWith("raw:") || wallet(v)) replacements[k] = valueFor(v);
  Object.assign(replacements, extraText);
  const keys = Object.keys(replacements).sort((a, b) => b.length - a.length);
  if (keys.length) {
    const re = new RegExp(keys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
    // Solo el <body>: el <head> trae la config de Tailwind y no debe tocarse.
    const i = html.indexOf("<body");
    html = html.slice(0, i) + html.slice(i).replace(re, m => replacements[m]);
  }
  return html;
}

/* ---------- Acciones de negocio ---------- */
function pay(amount, key, recipient, note) {
  const w = wallet(key);
  if (!w) return toast("Elige una billetera de origen");
  if (!(amount > 0)) return toast("Ingresa un monto mayor a S/ 0");
  if (amount > 500) return toast("Límite por yapeo: S/ 500");
  if (amount > w.balance) return toast(`Saldo insuficiente en ${w.name}. Disponible: S/ ${fmt(w.balance)}`);
  const today = new Date().toISOString().slice(0, 10);
  if (!state.daily || state.daily.date !== today) state.daily = { date: today, total: 0 };
  if (state.daily.total + amount > 2000) return toast(`Superas el límite diario de S/ 2,000. Hoy te quedan S/ ${fmt(2000 - state.daily.total)}`);
  state.daily.total = round2(state.daily.total + amount);
  w.balance = Math.round((w.balance - amount) * 100) / 100;
  state.last = { amount, walletName: w.name, key, recipient, note: String(note || "").trim() };
  if (state.draft.flow === "contact") state.lastContact = recipient;
  note = String(note || "").replace(/\s+/g, " ").trim();
  state.txs.unshift({ title: `Yapeo a ${recipient}`, amount: -amount, keys: [key], when: nowLabel(), ...(note ? { note } : {}) });
  state.draft = {};
  save();
  go(key === "principal" ? "constancia" : "constancia-negocio");
}
function receive() {
  state.wallets.principal.balance = Math.round((state.wallets.principal.balance + 85) * 100) / 100;
  state.txs.unshift({ title: "Yape de Lucía Gómez", amount: 85, keys: ["principal"], when: nowLabel() });
  save();
  go("te-yapearon");
}

function nameError(name, exceptKey) {
  if (!name) return "Escribe un nombre para tu billetera.";
  if (name.length < 3) return "El nombre debe tener al menos 3 caracteres.";
  if (name.length > 24) return "Máximo 24 caracteres.";
  if (activeKeys().some(o => o !== exceptKey && wallet(o).name.toLowerCase() === name.toLowerCase())) return "Ya tienes una billetera con ese nombre.";
  return null;
}
function createWallet(opts) {
  const name = String(opts.name || "").replace(/\s+/g, " ").trim();
  const err = nameError(name);
  if (err) return err;
  // El diseño de Inicio tiene un solo espacio para billeteras creadas por la usuaria.
  if (state.extra) return `Por ahora puedes tener una billetera adicional. Elimina "${state.extra.name}" para crear otra.`;
  state.extra = { name, balance: 0, icon: opts.icon, color: opts.color, purpose: opts.purpose };
  save();
  return null;
}
function renameWallet(k, raw) {
  if (k === "principal") return "La billetera Principal no se puede renombrar.";
  const name = String(raw || "").replace(/\s+/g, " ").trim();
  const err = nameError(name, k);
  if (err) return err;
  wallet(k).name = name;
  save();
  return null;
}
function transferMoney(from, to, amount, note) {
  const a = wallet(from), b = wallet(to);
  if (!b || from === to) return "Elige la billetera de destino.";
  if (!Number.isFinite(amount) || amount <= 0) return "Ingresa un monto mayor a S/ 0.";
  if (Math.abs(round2(amount) - amount) > 1e-9) return "Usa como máximo 2 decimales.";
  if (amount > a.balance + 1e-9) return `No tienes saldo suficiente. Disponible: S/ ${fmt(a.balance)}.`;
  note = String(note || "").replace(/\s+/g, " ").trim();
  if (note.length > 40) return "La descripción puede tener hasta 40 caracteres.";
  a.balance = round2(a.balance - amount);
  b.balance = round2(b.balance + amount);
  const when = nowLabel();
  const extra = note ? { note } : {};
  state.txs.unshift({ title: `Transferencia de ${a.name}`, amount, keys: [to], when, ...extra });
  state.txs.unshift({ title: `Transferencia a ${b.name}`, amount: -amount, keys: [from], when, ...extra });
  save();
  return null;
}
function removeWallet(k, moveTo) {
  const w = wallet(k);
  if (!w) return { error: "La billetera ya no existe." };
  if (k === "principal") return { error: "La billetera Principal no se puede eliminar." };
  if (w.balance > 0) {
    if (!moveTo) return { error: "Elige a qué billetera mover tu saldo antes de eliminarla." };
    const err = transferMoney(k, moveTo, w.balance);
    if (err) return { error: err };
  }
  const removed = txsFor(k).length;
  // Un pase entre billeteras sigue siendo movimiento de la otra: solo se le quita esta billetera.
  state.txs = state.txs.flatMap(t => !t.keys.includes(k) ? [t] : t.keys.length > 1 ? [{ ...t, keys: t.keys.filter(x => x !== k) }] : []);
  if (k === "extra") state.extra = null; else delete state.wallets[k];
  if (state.payWallet === k) state.payWallet = "principal";
  save();
  return { removedTxs: removed };
}
